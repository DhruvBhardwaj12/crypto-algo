data:
  exchange: binance
  base_url: "https://data-api.binance.vision"
  futures_base_url: "https://fapi.binance.com"
  symbols:
    - "BTCUSDT"
    - "ETHUSDT"
    - "SOLUSDT"
    - "BNBUSDT"
    - "XRPUSDT"
    - "DOGEUSDT"
    - "ADAUSDT"
    - "AVAXUSDT"
  interval: "1d"
  futures_interval: "4h"
  futures_intervals_to_fetch:
    - "5m"
  start_date: "2024-07-01"
  end_date: "2025-01-01"
  request_limit: 1000
  request_delay_seconds: 0.3
  raw_data_dir: "data/raw"

logging:
  level: "INFO"
  